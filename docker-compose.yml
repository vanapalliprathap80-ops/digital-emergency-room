version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: emergency_postgres
    environment:
      POSTGRES_DB: emergency
      POSTGRES_USER: emergency
      POSTGRES_PASSWORD: emergency123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergency -d emergency"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emergency_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/emergency
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-emergency}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-emergency123}
      SPRING_PROFILES_ACTIVE: docker
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emergency_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
