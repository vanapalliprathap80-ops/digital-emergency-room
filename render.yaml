services:
  - type: web
    name: digital-emergency-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: emergency-db
          property: connectionString

databases:
  - name: emergency-db
    databaseName: emergency
    user: emergency
    plan: free
