spring:
  application:
    name: digital-emergency-room

  datasource:
    url: jdbc:postgresql://localhost:5432/emergency
    username: emergency
    password: emergency123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    com.emergency: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN

emergency:
  traffic:
    max-count: 500
    rate-limit-per-minute: 600
  simulator:
    base-latency-ms: 50
    latency-jitter-ms: 100
